<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Lista de Nomes</title>
</head>
<body>

  <h2>atividades</h2>
  
  <ul id="lista"></ul>

  <br>

  <input type="text" id="nomeInput" placeholder="Digite um nome">

  <br><br>

  <button onclick="adicionarFinal()">Adicionar no final</button>
  <button onclick="adicionarInicio()">Adicionar no início</button>
  <button onclick="removerUltimo()">Remover último</button>
  <button onclick="removerPrimeiro()">Remover primeiro</button>

  <script>
   
    let nomes = ["Ana", "Carlos", "João", "Maria"];

    const lista = document.getElementById("lista");

    function renderizarLista() {
      lista.innerHTML = ""; 

      nomes.forEach(nome => {
        const li = document.createElement("li");
        li.textContent = nome;
        lista.appendChild(li);
      });
    }

   
    function adicionarFinal() {
      const input = document.getElementById("nomeInput");
      if (input.value !== "") {
        nomes.push(input.value);
        input.value = "";
        renderizarLista();
      }
    }

    function adicionarInicio() {
      const input = document.getElementById("nomeInput");
      if (input.value !== "") {
        nomes.unshift(input.value);
        input.value = "";
        renderizarLista();
      }
    }

    function removerUltimo() {
      nomes.pop();
      renderizarLista();
    }

    function removerPrimeiro() {
      nomes.shift();
      renderizarLista();
    }

    // inicializa
    renderizarLista();
  </script>

</body>
</html>
